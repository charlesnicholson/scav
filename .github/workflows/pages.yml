# Publishes the committed explainer as the site's index, https://charlesnicholson.github.io/scav/.
# The page is rebuilt and committed by hand (docs/explainer/README.md), so publishing is a copy.

name: pages

on:
  push:
    branches: ["main"]
    paths: ["docs/explainer/scav-explained.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

# A newer push replaces a deploy still queued; one already deploying finishes.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp docs/explainer/scav-explained.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
