# The Linux rows run in scav's own container rather than a hosted runner image.
# The Dockerfile at the repository root builds it and .github/workflows/docker-image.yml
# republishes it weekly. It carries the compilers and little else; scav still takes
# cmake, ninja, doctest and python from envy, which func.provisioning enforces.
#
# The package cache is the manifest's own out/.envy, which actions/cache carries
# between jobs -- warmth comes from the cache key, not from relocating the root.

name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A formatting push cancels the run that made it and starts a fresh one, which is
# the whole mechanism: the second run finds nothing to format and proceeds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Naming a scope drops the ones not named, so the ghcr pull needs saying too.
# `actions: write` is what lets the purge step's `gh cache delete` through; with
# only read it lists the superseded caches and then cannot remove any of them.
permissions:
  actions: write
  contents: write
  packages: read

# Compilation goes through sccache, one Actions cache namespace per preset:
# every job restores its preset's newest generation, pushes to main save a
# fresh one keyed by sha, and the purge script drops the generation each save
# supersedes, keeping the repository inside GitHub's 10 GB cache cap.
env:
  SCAV_REQUIRE_ENVY: "1"
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  SCCACHE_CACHE_SIZE: 500M

jobs:
  # The matrix: every triple x every configuration.

  linux:
    name: ${{ matrix.triple }} / ${{ matrix.config }}
    needs: format-code
    runs-on: ubuntu-latest
    container: ghcr.io/charlesnicholson/scav-ci:latest
    strategy:
      fail-fast: false
      matrix:
        triple: [linux-clang-libcxx, linux-clang-libstdcxx, linux-gcc-libstdcxx]
        config: [debug, release, testable]
    steps:
      - uses: actions/checkout@v4

      # No restore-keys: a bundle is cached under its identity, so a manifest that
      # moves the pinned ref would keep resolving the old specs from a prefix hit.
      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-linux-${{ hashFiles('envy.lua') }}

      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-${{ matrix.triple }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.triple }}-${{ matrix.config }}-

      - uses: mozilla-actions/sccache-action@v0.0.10

      - run: ./build.sh --preset ${{ matrix.triple }}-${{ matrix.config }} -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-${{ matrix.triple }}-${{ matrix.config }}-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        run: |
          "$(./bin/envy product python3)" .github/scripts/purge_superseded_caches.py

  macos:
    name: macos-clang-libcxx / ${{ matrix.config }}
    needs: format-code
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release, testable]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-macos-${{ hashFiles('envy.lua') }}

      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-macos-clang-libcxx-${{ matrix.config }}-${{ github.sha }}
          restore-keys: sccache-macos-clang-libcxx-${{ matrix.config }}-

      - uses: mozilla-actions/sccache-action@v0.0.10

      # Deliberately no setup-python and no brew install: the image has all three,
      # and using them would fail the provisioning test, which is what it is for.
      - run: ./build.sh --preset macos-clang-libcxx-${{ matrix.config }} -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-macos-clang-libcxx-${{ matrix.config }}-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        run: |
          "$(./bin/envy product python3)" .github/scripts/purge_superseded_caches.py

  windows:
    name: ${{ matrix.triple }} / ${{ matrix.config }}
    needs: format-code
    runs-on: windows-latest
    env:
      SCCACHE_CACHE_SIZE: 800M
    strategy:
      fail-fast: false
      matrix:
        triple: [windows-msvc, windows-clang]
        config: [debug, release, testable]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-windows-${{ hashFiles('envy.lua') }}

      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-${{ matrix.triple }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.triple }}-${{ matrix.config }}-

      - uses: mozilla-actions/sccache-action@v0.0.10

      # Dev shell and build in one step: it only changes its own process, so
      # splitting them would mean forwarding the environment. Both ship with VS.
      - shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          & "$env:GITHUB_WORKSPACE\build.bat" --preset ${{ matrix.triple }}-${{ matrix.config }} -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-${{ matrix.triple }}-${{ matrix.config }}-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        # bin/envy is a bash bootstrap that rejects MSYS's uname, so the Windows
        # interpreter comes from the sibling .bat launcher instead.
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\bin\python3.bat" .github/scripts/purge_superseded_caches.py

  # Sanitizers. Which one exists where is a toolchain fact, enumerated once by the
  # preset generator and checked by its test.

  linux-sanitizers:
    name: ${{ matrix.triple }} / ${{ matrix.sanitizer }}
    needs: format-code
    runs-on: ubuntu-latest
    container: ghcr.io/charlesnicholson/scav-ci:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: linux-clang-libcxx, sanitizer: asan }
          - { triple: linux-clang-libcxx, sanitizer: ubsan }
          - { triple: linux-clang-libcxx, sanitizer: tsan }
          - { triple: linux-clang-libstdcxx, sanitizer: asan }
          - { triple: linux-clang-libstdcxx, sanitizer: ubsan }
          - { triple: linux-clang-libstdcxx, sanitizer: tsan }
          - { triple: linux-gcc-libstdcxx, sanitizer: asan }
          - { triple: linux-gcc-libstdcxx, sanitizer: ubsan }
          - { triple: linux-gcc-libstdcxx, sanitizer: tsan }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-linux-${{ hashFiles('envy.lua') }}

      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-${{ matrix.triple }}-${{ matrix.sanitizer }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.triple }}-${{ matrix.sanitizer }}-

      - uses: mozilla-actions/sccache-action@v0.0.10

      - run: ./build.sh --preset ${{ matrix.triple }}-${{ matrix.sanitizer }} -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-${{ matrix.triple }}-${{ matrix.sanitizer }}-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        run: |
          "$(./bin/envy product python3)" .github/scripts/purge_superseded_caches.py

  linux-msan:
    needs: format-code
    # Its own job: the only row that has to build a standard library first, because
    # MSan against an uninstrumented one reports false positives forever.
    name: linux-clang-libcxx / msan
    runs-on: ubuntu-latest
    container: ghcr.io/charlesnicholson/scav-ci:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-linux-${{ hashFiles('envy.lua') }}

      # Keyed on the script, which is where the version and hash are pinned. A miss
      # costs one build; a stale hit costs a phantom finding, which is worse.
      - uses: actions/cache@v4
        with:
          path: out/msan-libcxx/prefix
          key: msan-libcxx-${{ hashFiles('tools/msan_libcxx.py') }}

      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-linux-clang-libcxx-msan-${{ github.sha }}
          restore-keys: sccache-linux-clang-libcxx-msan-

      - uses: mozilla-actions/sccache-action@v0.0.10

      - run: ./build.sh --preset linux-clang-libcxx-msan -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-linux-clang-libcxx-msan-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        run: |
          "$(./bin/envy product python3)" .github/scripts/purge_superseded_caches.py

  macos-sanitizers:
    name: macos-clang-libcxx / ${{ matrix.sanitizer }}
    needs: format-code
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-macos-${{ hashFiles('envy.lua') }}
      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-macos-clang-libcxx-${{ matrix.sanitizer }}-${{ github.sha }}
          restore-keys: sccache-macos-clang-libcxx-${{ matrix.sanitizer }}-

      - uses: mozilla-actions/sccache-action@v0.0.10

      - run: ./build.sh --preset macos-clang-libcxx-${{ matrix.sanitizer }} -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-macos-clang-libcxx-${{ matrix.sanitizer }}-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        run: |
          "$(./bin/envy product python3)" .github/scripts/purge_superseded_caches.py

  windows-sanitizers:
    name: ${{ matrix.triple }} / ${{ matrix.sanitizer }}
    needs: format-code
    runs-on: windows-latest
    env:
      SCCACHE_CACHE_SIZE: 800M
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC has AddressSanitizer and no UBSan; clang-cl has UBSan and an
          # ASan whose runtime never reaches the link line; neither Windows
          # toolchain has a ThreadSanitizer.
          - { triple: windows-msvc, sanitizer: asan }
          - { triple: windows-clang, sanitizer: ubsan }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-windows-${{ hashFiles('envy.lua') }}
      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-${{ matrix.triple }}-${{ matrix.sanitizer }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.triple }}-${{ matrix.sanitizer }}-

      - uses: mozilla-actions/sccache-action@v0.0.10

      # Dev shell and build in one step: it only changes its own process, so
      # splitting them would mean forwarding the environment. Both ship with VS.
      - shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          & "$vsPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          & "$env:GITHUB_WORKSPACE\build.bat" --preset ${{ matrix.triple }}-${{ matrix.sanitizer }} -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-${{ matrix.triple }}-${{ matrix.sanitizer }}-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        # bin/envy is a bash bootstrap that rejects MSYS's uname, so the Windows
        # interpreter comes from the sibling .bat launcher instead.
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\bin\python3.bat" .github/scripts/purge_superseded_caches.py

  # Branch coverage, and the gate that an untested file fails the build.

  coverage:
    name: coverage gate
    needs: format-code
    runs-on: ubuntu-latest
    container: ghcr.io/charlesnicholson/scav-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-linux-${{ hashFiles('envy.lua') }}
      - name: Restore compiler cache
        id: sccache
        uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-linux-clang-libcxx-coverage-${{ github.sha }}
          restore-keys: sccache-linux-clang-libcxx-coverage-

      - uses: mozilla-actions/sccache-action@v0.0.10

      - run: ./build.sh --coverage --preset linux-clang-libcxx-coverage -- -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save compiler cache
        id: sccache-save
        uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .sccache
          key: ${{ steps.sccache.outputs.cache-primary-key }}

      - name: Purge superseded caches
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SCCACHE_PREFIX: sccache-linux-clang-libcxx-coverage-
          SCCACHE_KEEP: ${{ steps.sccache-save.outcome == 'success' && steps.sccache.outputs.cache-primary-key || '' }}
        run: |
          "$(./bin/envy product python3)" .github/scripts/purge_superseded_caches.py

  # One job, one platform: clang-format's output moves between releases, so the
  # gate wants one version, and the image is what pins it.

  # The gate every other job waits on: it rewrites the branch instead of
  # rejecting it. A push here cancels this run through the concurrency group and
  # a fresh one starts, which finds nothing left to format.
  #
  # CI_PUSH_TOKEN is a PAT, because a commit pushed with the default GITHUB_TOKEN
  # does not trigger workflows and the restart is the whole point. Without it the
  # job reports the diff instead -- never silently accepts it.
  format-code:
    name: format code
    runs-on: ubuntu-latest
    container: ghcr.io/charlesnicholson/scav-ci:latest
    env:
      SCAV_LINT: 1
      # `secrets` is not usable in an `if:`.
      HAS_PUSH_TOKEN: ${{ secrets.CI_PUSH_TOKEN != '' }}
    steps:
      # The branch, not the PR's merge commit, or the push has nothing to land on.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.CI_PUSH_TOKEN || github.token }}

      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-lint-${{ hashFiles('envy.lua', 'envy/*.lua') }}

      - name: Format
        run: "$(./bin/envy product python3) tools/format.py"

      - name: Did anything change
        id: diff
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # Never to main, and never to a fork's branch.
      - name: Commit and push the formatting
        id: push
        if: >
          steps.diff.outputs.changed == '1'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && env.HAS_PUSH_TOKEN == 'true'
        run: |
          set -euo pipefail
          git config user.name "scav format bot"
          git config user.email "noreply@github.com"
          git commit -am "style: clang-format"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "Pushed a formatting commit; this run is superseded." >> "$GITHUB_STEP_SUMMARY"

      # Only when the diff could not be pushed.
      - name: Report unformatted code
        if: steps.diff.outputs.changed == '1' && steps.push.outcome == 'skipped'
        run: |
          git --no-pager diff
          echo "Run: \$(./bin/envy product python3) tools/format.py" >&2
          exit 1

  clang-tidy:
    name: clang-tidy
    needs: format-code
    runs-on: ubuntu-latest
    container: ghcr.io/charlesnicholson/scav-ci:latest
    env:
      SCAV_LINT: 1  # the clang tools, which no compiling row pays for
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-lint-${{ hashFiles('envy.lua', 'envy/*.lua') }}

      # Runs as part of compilation, so a finding fails the build with a file and
      # line rather than in a separate report.
      - name: clang-tidy
        run: >
          ./build.sh --preset linux-clang-libcxx-debug --no-test
          -- -DSCAV_CLANG_TIDY=ON

  # The incumbent layout engines, provisioned on every platform. It cannot
  # score a blind review -- that is a human looking at pictures -- so what it
  # gates is provisioning: that the three specs still resolve, download and run
  # everywhere. That is the part which rots silently between layout gates, and
  # it is no more exposed to a network hiccup than any compiling row already is.
  baseline-engines:
    name: baseline engines / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCAV_BASELINE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: out/.envy
          key: envy-baseline-${{ runner.os }}-${{ hashFiles('envy.lua', 'envy/*.lua') }}

      # No container for the linux row: nothing here compiles, so the hosted
      # image is enough and the engines are what is under test.
      # Each engine renders a two-state probe rather than reporting a version.
      # `plantuml -version` exits 16, and a version string proves only that the
      # binary starts -- not that it found the AWT and freetype libraries the
      # archive ships beside it, which is the failure worth catching here.
      - name: Provision and run each engine
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ./bin/envy sync
          printf '@startuml\nstate A\nstate B\nA --> B\n@enduml\n' > out/probe.puml
          "$(./bin/envy product plantuml)" -tsvg -Playout=smetana out/probe.puml
          grep -q '<svg' out/probe.svg
          "$(./bin/envy product node)" --version
          "$(./bin/envy product node)" -e \
            "new (require(process.argv[1]))().layout({id:'r',children:[{id:'a',width:1,height:1}]}).then(g=>console.log('elkjs',g.id))" \
            "$(./bin/envy product elk_bundle)"

      # bin/envy is a bash bootstrap that rejects MSYS's uname, so the Windows
      # interpreter comes from the sibling .bat launcher instead.
      - name: Provision and run each engine
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\bin\envy.bat sync
          if ($LASTEXITCODE -ne 0) { throw "envy sync failed" }
          $puml = & .\bin\envy.bat product plantuml
          $node = & .\bin\envy.bat product node
          $elk = & .\bin\envy.bat product elk_bundle
          # Each native call overwrites $LASTEXITCODE, so checking it once at
          # the end would let a failing plantuml or node leave the job green --
          # which is the failure this row exists to catch.
          Set-Content -Path out\probe.puml -Value "@startuml`nstate A`nstate B`nA --> B`n@enduml"
          & $puml -tsvg -Playout=smetana out\probe.puml
          if ($LASTEXITCODE -ne 0) { throw "plantuml failed to run" }
          if (-not (Select-String -Path out\probe.svg -Pattern "<svg" -Quiet)) {
            throw "plantuml wrote no svg"
          }
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw "node failed to run" }
          & $node -e "new (require(process.argv[1]))().layout({id:'r',children:[{id:'a',width:1,height:1}]}).then(g=>console.log('elkjs',g.id))" $elk
          if ($LASTEXITCODE -ne 0) { throw "elkjs failed to run" }

  # The one check branch protection names. Jobs come and go; this does not, so
  # adding or retiring a row is a workflow edit rather than a repository settings
  # change -- and an old commit rebuilt years from now still reports against a
  # name that exists.
  #
  # `if: always()` with an explicit result check, because a job that merely
  # `needs:` a failed job is *skipped*, and a skipped required check does not
  # block a merge.

  all-checks-pass:
    name: all checks pass
    if: always()
    needs:
      - linux
      - macos
      - windows
      - linux-sanitizers
      - linux-msan
      - macos-sanitizers
      - windows-sanitizers
      - coverage
      - format-code
      - clang-tidy
      - baseline-engines
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo '${{ toJSON(needs) }}'
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: exit 1
